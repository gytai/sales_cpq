<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <select id="cpq-dict-code" class="form-control" style="display:inline-block;width:180px;margin-left:8px">
                    <option value="">全部字典分类</option>
                    {foreach name="dictCodes" item="code"}
                    <option value="{$code|htmlentities}">{$code}</option>
                    {/foreach}
                </select>
                <input type="text" id="cpq-dict-keyword" class="form-control" style="display:inline-block;width:180px;margin-left:4px" placeholder="显示名/值编码关键字">
            </div>
            <p class="text-muted" style="padding:8px 15px 0;margin:0">系统参数以 dictionary_code=system_param 维护；已被业务引用的字典值只能停用，不能改码或删除。</p>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
        </div>
    </div>
</div>

<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <select id="cpq-job-type" class="form-control" style="display:inline-block;width:150px;margin-left:8px">
                    <option value="">全部类型</option>
                    {foreach name="typeList" item="type"}
                    <option value="{$type}">{$type}</option>
                    {/foreach}
                </select>
                <select id="cpq-job-status" class="form-control" style="display:inline-block;width:120px;margin-left:4px">
                    <option value="">全部状态</option>
                    {foreach name="statusList" item="st"}
                    <option value="{$st}">{$st}</option>
                    {/foreach}
                </select>
                <input type="text" id="cpq-job-from" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" style="display:inline-block;width:130px;margin-left:4px" placeholder="创建自">
                <input type="text" id="cpq-job-to" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" style="display:inline-block;width:130px;margin-left:4px" placeholder="创建至">
            </div>
            <p class="text-muted" style="padding:8px 15px 0;margin:0">普通用户仅可见自己发起的任务；系统管理员与审计可见全部。失败任务可由发起人或特权角色重试。</p>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
        </div>
    </div>
</div>

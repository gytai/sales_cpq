<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[status]" value="{$row.status|htmlentities}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">产品系列:</label>
        <div class="col-xs-12 col-sm-8"><input class="form-control selectpage" data-rule="required" data-source="cpq/product_series/index" data-field="name" name="row[series_id]" value="{$row.series_id|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">型号编码:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[code]" value="{$row.code|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">产品分类:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" name="row[category_code]" value="{$row.category_code|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">中文名称:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[name]" value="{$row.name|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">英文名称:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" name="row[name_en]" value="{$row.name_en|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">基础物料编码:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" name="row[base_item_code]" value="{$row.base_item_code|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">计量单位:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[unit]" value="{$row.unit|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">允许销售自定义:</label>
        <div class="col-xs-12 col-sm-3">{:build_radios('row[allow_custom]', ['1'=>'是','0'=>'否'], $row.allow_custom)}</div>
        <label class="control-label col-xs-12 col-sm-2">允许海外销售:</label>
        <div class="col-xs-12 col-sm-3">{:build_radios('row[allow_overseas]', ['1'=>'是','0'=>'否'], $row.allow_overseas)}</div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">生效日期:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[effective_date]" value="{$row.effective_date|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">失效日期:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[expiry_date]" value="{$row.expiry_date|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">版本:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" type="number" min="1" name="row[version]" value="{$row.version|htmlentities}"></div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">保存</button></div>
    </div>
</form>

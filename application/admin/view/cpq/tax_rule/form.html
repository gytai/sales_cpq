<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[status]" value="{$row.status|htmlentities}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">税率编码:</label>
        <div class="col-xs-12 col-sm-8"><input class="form-control" data-rule="required" name="row[code]" value="{$row.code|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">国家编码:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" name="row[country_code]" value="{$row.country_code|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">区域编码:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" name="row[region_code]" value="{$row.region_code|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">产品类型:</label>
        <div class="col-xs-12 col-sm-3">{:build_select('row[product_type]', $productTypeList, $row.product_type, ['class'=>'form-control selectpicker'])}</div>
        <label class="control-label col-xs-12 col-sm-2">税率:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[rate]" value="{$row.rate|htmlentities}"><p class="help-block">[0,1] 之间的小数（如 0.13 表示 13%）；前端不做精度计算，原样提交。</p></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">生效日期:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-rule="required" data-date-format="YYYY-MM-DD" name="row[effective_date]" value="{$row.effective_date|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">失效日期:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[expiry_date]" value="{$row.expiry_date|htmlentities}"></div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">保存</button></div>
    </div>
</form>

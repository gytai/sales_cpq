<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <a href="javascript:;" class="btn btn-success btn-cpq-quote-add" title="新建报价"><i class="fa fa-plus"></i> 新建报价</a>
                <div class="btn-group" id="cpq-quote-views" style="margin-left:8px">
                    <button type="button" class="btn btn-default active" data-status="">全部</button>
                    <button type="button" class="btn btn-default" data-status="draft,withdrawn">待处理草稿</button>
                    <button type="button" class="btn btn-default" data-status="submitted">审批中</button>
                    <button type="button" class="btn btn-default" data-status="approved">已批准</button>
                    <button type="button" class="btn btn-default" data-status="sent,accepted">已发送/接受</button>
                    <button type="button" class="btn btn-default" data-status="rejected,cancelled,expired,revised">已关闭</button>
                </div>
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                   data-operate-detail="{:$auth->check('cpq/quote/detail')}"
                   data-auth-wizard="{:$auth->check('cpq/quote/wizard')}"
                   data-auth-save="{:$auth->check('cpq/quote/save')}"
                   data-auth-submit="{:$auth->check('cpq/quote/submit')}"
                   data-auth-withdraw="{:$auth->check('cpq/quote/withdraw')}"
                   data-auth-copy="{:$auth->check('cpq/quote/copy')}"
                   data-auth-revision="{:$auth->check('cpq/quote/revision')}"
                   data-auth-diff="{:$auth->check('cpq/quote/diff')}"
                   width="100%">
            </table>
        </div>
    </div>
</div>

<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">规则编码:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control" data-rule="required" name="row[code]" value="{$row.code|default=''|htmlentities}" placeholder="如 CPQ-APR-LINE-DEMO">
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">规则名称:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control" data-rule="required" name="row[name]" value="{$row.name|default=''|htmlentities}">
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">审批节点:</label>
    <div class="col-xs-12 col-sm-8">
        <select class="form-control selectpicker" data-rule="required" name="row[node]">
            {foreach name="nodeList" key="nodeKey" item="nodeText"}
            <option value="{$nodeKey}" {if isset($row.node) && $row.node eq $nodeKey}selected{/if}>{$nodeText}</option>
            {/foreach}
        </select>
        <p class="help-block">销售确认节点固定由报价负责人处理，无需配置规则。</p>
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">审批角色:</label>
    <div class="col-xs-12 col-sm-8">
        <select class="form-control selectpicker" name="row[approver_role]">
            <option value="">（不按角色，仅用显式候选人）</option>
            {foreach name="roleList" key="roleKey" item="roleText"}
            <option value="{$roleKey}" {if isset($row.approver_role) && $row.approver_role eq $roleKey}selected{/if}>{$roleText}（{$roleKey}）</option>
            {/foreach}
        </select>
        <p class="help-block">角色与用户组名称精确匹配；角色成员与显式候选人取并集。</p>
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">适用产品线:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control" name="row[product_line]" value="{$row.product_line|default=''|htmlentities}" placeholder="留空=全部产品线（兜底规则）">
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">显式候选人:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control selectpage" id="cpq-rule-candidates" data-source="auth/admin/index" data-field="nickname" data-multiple="true" value="">
        <input type="hidden" id="cpq-rule-candidates-json" name="row[candidate_admin_ids]" value="{$row.candidate_admin_ids|default=''|htmlentities}">
        <p class="help-block">可多选；保存为管理员 ID 数组。职责分离与产品线数据范围在解析时由服务端过滤。</p>
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">SLA（小时）:</label>
    <div class="col-xs-12 col-sm-8">
        <input class="form-control" type="number" min="0" step="1" name="row[sla_hours]" value="{$row.sla_hours|default=24}">
    </div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">状态:</label>
    <div class="col-xs-12 col-sm-8">
        <select class="form-control selectpicker" name="row[status]">
            {foreach name="statusList" key="statusKey" item="statusText"}
            <option value="{$statusKey}" {if isset($row.status) && $row.status eq $statusKey}selected{/if}>{$statusText}</option>
            {/foreach}
        </select>
        <p class="help-block">启用中的规则不可编辑；编辑保存后版本号自动递增。</p>
    </div>
</div>

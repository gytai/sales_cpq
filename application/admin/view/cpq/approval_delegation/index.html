<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <a href="javascript:;" class="btn btn-success btn-cpq-delegation-add" style="margin-left:8px" title="新增委托申请（待审批后生效）"><i class="fa fa-plus"></i> 新增委托</a>
                <select id="cpq-delegation-status" class="form-control" style="display:inline-block;width:130px;margin-left:8px">
                    <option value="">全部状态</option>
                    {foreach name="statusList" key="statusKey" item="statusText"}
                    <option value="{$statusKey}">{$statusText}</option>
                    {/foreach}
                </select>
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                   data-can-approve="{if $canApproveDelegation}1{else /}0{/if}"
                   data-auth-create="{:$auth->check('cpq/approval_delegation/create')}"
                   data-auth-approve="{:$auth->check('cpq/approval_delegation/approve')}"
                   data-auth-cancel="{:$auth->check('cpq/approval_delegation/cancel')}"
                   width="100%">
            </table>
        </div>
    </div>
</div>

<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <select id="cpq-record-action" class="form-control" style="display:inline-block;width:130px;margin-left:8px">
                    <option value="">全部动作</option>
                    {foreach name="actionList" key="actionKey" item="actionText"}
                    <option value="{$actionKey}">{$actionText}</option>
                    {/foreach}
                </select>
                <select id="cpq-record-line" class="form-control" style="display:inline-block;width:140px;margin-left:4px">
                    <option value="">全部产品线</option>
                    {foreach name="productLineList" item="line"}
                    <option value="{$line}">{$line}</option>
                    {/foreach}
                </select>
                <input type="text" id="cpq-record-time" class="form-control datetimerange" style="display:inline-block;width:220px;margin-left:4px" placeholder="处理时间范围" autocomplete="off">
                <input type="text" id="cpq-record-keyword" class="form-control" style="display:inline-block;width:170px;margin-left:4px" placeholder="单号/名称关键字">
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
        </div>
    </div>
</div>

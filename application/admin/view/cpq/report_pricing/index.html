<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <form id="cpq-filter-form" class="form-inline" style="margin-bottom:12px">
            <select name="company" class="form-control" title="事业部">
                <option value="">全部事业部</option>
                {foreach name="companyList" item="company"}
                <option value="{$company}">{$company}</option>
                {/foreach}
            </select>
            <input type="number" name="sales_org_id" class="form-control" placeholder="销售组织ID" style="width:110px">
            <select name="product_line" class="form-control" title="产品线">
                <option value="">全部产品线</option>
                {foreach name="productLineList" item="line"}
                <option value="{$line}">{$line}</option>
                {/foreach}
            </select>
            <input type="number" name="region_id" class="form-control" placeholder="区域ID" style="width:100px">
            <select name="currency" class="form-control" title="币种">
                <option value="">全部币种</option>
                {foreach name="currencyList" item="currency"}
                <option value="{$currency}">{$currency}</option>
                {/foreach}
            </select>
            <input type="date" name="created_from" class="form-control" title="创建开始">
            <input type="date" name="created_to" class="form-control" title="创建结束">
            <button type="submit" class="btn btn-primary"><i class="fa fa-search"></i> 查询</button>
            <button type="button" class="btn btn-default cpq-filter-reset"><i class="fa fa-undo"></i> 重置</button>
        </form>

        <div class="panel panel-default">
            <div class="panel-heading">折扣与毛利分析（产品线 → 型号）</div>
            <div class="panel-body" style="padding:0">
                <table class="table table-striped table-hover table-nowrap" style="margin-bottom:0">
                    <thead>
                    <tr>
                        <th>产品线</th>
                        <th>型号</th>
                        <th>行数</th>
                        <th>平均折扣</th>
                        <th>未税金额合计</th>
                        <th>总金额合计</th>
                        <th class="cpq-col-margin-amount">毛利额</th>
                        <th class="cpq-col-margin-rate">毛利率</th>
                    </tr>
                    </thead>
                    <tbody id="cpq-pricing-body"></tbody>
                </table>
            </div>
        </div>
        <p class="text-muted" id="cpq-pricing-note"></p>
    </div>
</div>

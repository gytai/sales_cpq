<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body"><div class="widget-body no-padding">
        <div id="toolbar" class="toolbar">{:build_toolbar('refresh,add,edit,del')}</div>
        <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
               data-operate-edit="{:$auth->check('cpq/config_template/edit')}"
               data-operate-del="{:$auth->check('cpq/config_template/del')}"
               data-operate-detail="{:$auth->check('cpq/config_template/detail')}"
               data-auth-submit="{:$auth->check('cpq/config_template/submit')}"
               data-auth-publish="{:$auth->check('cpq/config_template/publish')}"
               data-auth-expire="{:$auth->check('cpq/config_template/expire')}"
               data-auth-copy="{:$auth->check('cpq/config_template/copy')}" width="100%"></table>
    </div></div>
</div>

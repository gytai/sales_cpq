<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <select id="cpq-itg-type" class="form-control" style="display:inline-block;width:130px;margin-left:8px">
                    <option value="">全部系统类型</option>
                    <option value="crm">CRM</option>
                    <option value="erp">ERP</option>
                    <option value="mail">邮件</option>
                    <option value="other">其他</option>
                </select>
                <select id="cpq-itg-status" class="form-control" style="display:inline-block;width:110px;margin-left:4px">
                    <option value="">全部状态</option>
                    <option value="enabled">启用</option>
                    <option value="disabled">停用</option>
                </select>
                <input type="text" id="cpq-itg-keyword" class="form-control" style="display:inline-block;width:180px;margin-left:4px" placeholder="编码/名称关键字">
            </div>
            <p class="text-muted" style="padding:8px 15px 0;margin:0">凭证以 AES-256-GCM 密文存储，任何页面均不回显；仅支持「重置凭证」整体覆盖写入，重置动作写入审计日志。</p>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
        </div>
    </div>
</div>

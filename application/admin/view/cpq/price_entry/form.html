<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">价格表:</label><div class="col-xs-12 col-sm-8"><input class="form-control selectpage" data-source="cpq/price_entry/selectbook" data-field="name" data-rule="required" name="row[price_book_id]" value="{$row.price_book_id|htmlentities}"><span class="help-block">仅显示草稿或待审批价格表；已发布价格表请先在“价格表”中复制新版本。</span></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">对象类型:</label><div class="col-xs-12 col-sm-3">{:build_select('row[target_type]', $targetTypeList, $row.target_type, ['class'=>'form-control selectpicker', 'id'=>'cpq-target-type'])}</div><label class="control-label col-xs-12 col-sm-2">定价对象:</label><div class="col-xs-12 col-sm-3"><input class="form-control" id="cpq-target-id" data-source="cpq/price_entry/selecttarget" data-field="name" data-primary-key="id" data-rule="required" name="row[target_id]" value="{$row.target_id|htmlentities}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">金额:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required;decimal" name="row[amount]" value="{$row.amount|htmlentities}"><span class="help-block">以 Decimal 字符串提交。</span></div><label class="control-label col-xs-12 col-sm-2">单位:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[unit]" value="{$row.unit|htmlentities}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">最小数量:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required;decimal" name="row[min_qty]" value="{$row.min_qty|htmlentities}"></div><label class="control-label col-xs-12 col-sm-2">最大数量:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="decimal" name="row[max_qty]" value="{$row.max_qty|htmlentities}"></div></div>
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">保存</button></div></div></form>

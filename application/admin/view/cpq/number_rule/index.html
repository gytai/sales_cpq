<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <select id="cpq-rule-status" class="form-control" style="display:inline-block;width:120px;margin-left:8px">
                    <option value="">全部状态</option>
                    <option value="enabled">启用</option>
                    <option value="disabled">停用</option>
                </select>
                <input type="text" id="cpq-rule-keyword" class="form-control" style="display:inline-block;width:180px;margin-left:4px" placeholder="编码/名称关键字">
            </div>
            <p class="text-muted" style="padding:8px 15px 0;margin:0">编号格式支持 {YYYY} {MM} {DD} {SCOPE} 与 {SEQn}（n=1-10 序号宽度）占位符；「试算」以序号 123 渲染，不产生真实编号。已产生计数器的规则修改格式需二次确认。</p>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
        </div>
    </div>
</div>

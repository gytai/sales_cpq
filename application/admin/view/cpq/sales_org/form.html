<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action=""><div class="form-group"><label class="control-label col-xs-12 col-sm-2">组织编码:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[code]" value="{$row.code|htmlentities}"></div><label class="control-label col-xs-12 col-sm-2">组织名称:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[name]" value="{$row.name|htmlentities}"></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">上级组织:</label><div class="col-xs-12 col-sm-3"><input class="form-control selectpage" data-source="cpq/sales_org/index" data-field="name" name="row[parent_id]" value="{$row.parent_id|htmlentities}"></div><label class="control-label col-xs-12 col-sm-2">负责人管理员ID:</label><div class="col-xs-12 col-sm-3"><input class="form-control" type="number" name="row[manager_id]" value="{$row.manager_id|htmlentities}"></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">生效日期:</label><div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[effective_date]" value="{$row.effective_date|htmlentities}"></div><label class="control-label col-xs-12 col-sm-2">失效日期:</label><div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[expiry_date]" value="{$row.expiry_date|htmlentities}"></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">状态:</label><div class="col-xs-12 col-sm-8">{:build_radios('row[status]', $statusList, $row.status)}</div></div><div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">保存</button></div></div></form>

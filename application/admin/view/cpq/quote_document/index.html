<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <a href="javascript:;" class="btn btn-success btn-cpq-generate" style="margin-left:8px" title="选择已提交报价生成正式 PDF（异步任务）"><i class="fa fa-file-pdf-o"></i> 生成 PDF</a>
                <select id="cpq-doc-status" class="form-control" style="display:inline-block;width:130px;margin-left:8px">
                    <option value="">全部状态</option>
                    {foreach name="statusList" key="statusKey" item="statusText"}
                    <option value="{$statusKey}">{$statusText}</option>
                    {/foreach}
                </select>
                <select id="cpq-doc-line" class="form-control" style="display:inline-block;width:140px;margin-left:4px">
                    <option value="">全部产品线</option>
                    {foreach name="productLineList" item="line"}
                    <option value="{$line}">{$line}</option>
                    {/foreach}
                </select>
                <input type="text" id="cpq-doc-keyword" class="form-control" style="display:inline-block;width:170px;margin-left:4px" placeholder="单号/名称关键字">
                <span class="text-muted" style="margin-left:8px">排队/生成中任务每 5 秒自动刷新</span>
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                   data-auth-generate="{:$auth->check('cpq/quote_document/generate')}"
                   data-auth-download="{:$auth->check('cpq/quote_document/download')}"
                   data-auth-verify="{:$auth->check('cpq/quote_document/verify')}"
                   data-auth-retry="{:$auth->check('cpq/quote_document/retry')}"
                   width="100%">
            </table>
        </div>
    </div>
</div>

# CPQ 开发环境（方案 §10 Docker 部署的开发态子集）
# 启动与初始化：见 docker/README.md；版本锁定决策：见 docs/adr/0003
services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${CPQ_HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/fastadmin.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # 代码目录挂载开发；vendor/thinkphp/runtime 由匿名卷保护，避免被空挂载覆盖
      - ./:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/thinkphp
      - cpq_runtime:/var/www/html/runtime
    environment:
      CPQ_DB_HOST: mysql
      CPQ_REDIS_HOST: redis
    restart: unless-stopped

  worker:
    # 队列 worker：与 app 同镜像，消费 think-queue Redis 队列
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - app
    command: ["php", "think", "queue:listen", "--queue", "default", "--sleep", "1", "--tries", "3"]
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/thinkphp
      - cpq_runtime:/var/www/html/runtime
    restart: unless-stopped

  mysql:
    # 8.0 与 5.7 的 PoC 结论见 docs/cpq/m0-poc.md；默认 8.0（5.7 已 EOL）
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${CPQ_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${CPQ_MYSQL_DATABASE:-fastadmin}
      TZ: Asia/Shanghai
    ports:
      - "${CPQ_MYSQL_PORT:-33061}:3306"
    volumes:
      - cpq_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${CPQ_MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - "${CPQ_REDIS_PORT:-63791}:6379"
    volumes:
      - cpq_redis:/data
    restart: unless-stopped

volumes:
  cpq_mysql:
  cpq_redis:
  cpq_runtime:

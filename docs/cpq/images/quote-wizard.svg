<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">报价向导六步流程（报价中心 → 报价管理 → 报价向导）</text>

  <!-- 六步横向主链 -->
  <!-- 步骤盒子：宽 168 高 150，间距 24，起始 x=40；y=90 -->
  <g>
    <rect x="40" y="90" width="168" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="40" y="90" width="168" height="34" rx="10" fill="#2563eb"/>
    <text x="124" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">① 客户基本信息</text>
    <text x="52" y="146" font-size="10.5" fill="#334155">· 报价名称 / 产品线*</text>
    <text x="52" y="165" font-size="10.5" fill="#334155">· 报价币种 CNY/USD/EUR</text>
    <text x="52" y="184" font-size="10.5" fill="#334155">· 客户* / 代理商 / 销售组织</text>
    <text x="52" y="203" font-size="10.5" fill="#334155">· 我方公司 / 市场范围</text>
    <text x="52" y="222" font-size="10.5" fill="#334155">· 产品线决定价格与数据范围</text>
  </g>
  <line x1="208" y1="165" x2="232" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <g>
    <rect x="236" y="90" width="168" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="236" y="90" width="168" height="34" rx="10" fill="#2563eb"/>
    <text x="320" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">② 选择产品</text>
    <text x="248" y="146" font-size="10.5" fill="#334155">· 选择已发布的产品型号</text>
    <text x="248" y="165" font-size="10.5" fill="#334155">· 填数量与单位</text>
    <text x="248" y="184" font-size="10.5" fill="#334155">· 「添加明细行」</text>
    <text x="248" y="203" font-size="10.5" fill="#334155">· 一单可含多行明细</text>
    <text x="248" y="222" font-size="10.5" fill="#334155">· 未发布型号不可选</text>
  </g>
  <line x1="404" y1="165" x2="428" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <g>
    <rect x="432" y="90" width="168" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="432" y="90" width="168" height="34" rx="10" fill="#2563eb"/>
    <text x="516" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">③ 产品配置</text>
    <text x="444" y="146" font-size="10.5" fill="#334155">· 每行明细独立配置</text>
    <text x="444" y="165" font-size="10.5" fill="#334155">· 按配置组选选项/填参数</text>
    <text x="444" y="184" font-size="10.5" fill="#334155">· 服务端实时校验</text>
    <text x="444" y="203" font-size="10.5" fill="#334155">· 依赖/互斥/显显隐违规则</text>
    <text x="444" y="222" font-size="10.5" fill="#334155">· 标红提示，改配置后重校验</text>
  </g>
  <line x1="600" y1="165" x2="624" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <g>
    <rect x="628" y="90" width="168" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="628" y="90" width="168" height="34" rx="10" fill="#2563eb"/>
    <text x="712" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">④ 价格与折扣</text>
    <text x="640" y="146" font-size="10.5" fill="#334155">· 服务端试算（同版本重算）</text>
    <text x="640" y="165" font-size="10.5" fill="#334155">· 基准价+选项+费用+税</text>
    <text x="640" y="184" font-size="10.5" fill="#334155">· 行级手工折扣+折扣原因</text>
    <text x="640" y="203" font-size="10.5" fill="#334155">· 跨币种按汇率快照折算</text>
    <text x="640" y="222" font-size="10.5" fill="#334155">· 金额全为 Decimal 字符串</text>
  </g>
  <line x1="796" y1="165" x2="820" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <g>
    <rect x="824" y="90" width="168" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="824" y="90" width="168" height="34" rx="10" fill="#2563eb"/>
    <text x="908" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">⑤ 商务条款</text>
    <text x="836" y="146" font-size="10.5" fill="#334155">· 交货/付款/质保条款</text>
    <text x="836" y="165" font-size="10.5" fill="#334155">· 有效期等商务信息</text>
    <text x="836" y="184" font-size="10.5" fill="#334155">· 提交时一并冻结快照</text>
    <text x="836" y="203" font-size="10.5" fill="#334155">· 条款随版本快照保存</text>
  </g>
  <line x1="992" y1="165" x2="1016" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <g>
    <rect x="1020" y="90" width="160" height="150" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
    <rect x="1020" y="90" width="160" height="34" rx="10" fill="#059669"/>
    <text x="1100" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">⑥ 预览与提交</text>
    <text x="1032" y="146" font-size="10.5" fill="#334155">· 汇总预览（明细/金额/</text>
    <text x="1032" y="165" font-size="10.5" fill="#334155">  条款/审批分级提示）</text>
    <text x="1032" y="184" font-size="10.5" fill="#334155">· 阻断原因逐条展示</text>
    <text x="1032" y="203" font-size="10.5" fill="#334155">· 点「提交」进入审批</text>
  </g>

  <!-- 全局动作条 -->
  <rect x="40" y="280" width="1140" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="60" y="306" font-size="12.5" font-weight="600" fill="#334155">全程可用：</text>
  <rect x="130" y="290" width="120" height="30" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="190" y="310" text-anchor="middle" font-size="11.5" fill="#1e40af">保存草稿（随时）</text>
  <rect x="266" y="290" width="150" height="30" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="341" y="310" text-anchor="middle" font-size="11.5" fill="#1e40af">服务端试算（重算）</text>
  <rect x="432" y="290" width="190" height="30" rx="15" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="527" y="310" text-anchor="middle" font-size="11.5" fill="#92400e">乐观锁（他人改动即拦截）</text>
  <rect x="638" y="290" width="240" height="30" rx="15" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="758" y="310" text-anchor="middle" font-size="11.5" fill="#92400e">后端错误自动定位到出错步骤/字段</text>
  <rect x="894" y="290" width="130" height="30" rx="15" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
  <text x="959" y="310" text-anchor="middle" font-size="11.5" fill="#065f46">草稿→编号 Q-日期-序号</text>

  <!-- 提交后分支 -->
  <text x="600" y="384" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">提交时服务端动作（同一事务）</text>
  <rect x="240" y="400" width="720" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="420" text-anchor="middle" font-size="11.5" fill="#1e40af">最终配置校验 → 价格重算 → 底线/条款校验 → 冻结版本快照（版本号 +1，配置/价格/条款不可变）</text>
  <text x="600" y="440" text-anchor="middle" font-size="11.5" fill="#1e40af">→ 按成交单价判定审批分级 → 创建审批实例与首个节点任务（幂等键防重复提交）</text>

  <line x1="330" y1="450" x2="240" y2="490" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <line x1="600" y1="450" x2="600" y2="490" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <line x1="870" y1="450" x2="960" y2="490" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowG)"/>

  <rect x="110" y="494" width="240" height="72" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="230" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">单价 ≥ 指导价</text>
  <text x="230" y="538" text-anchor="middle" font-size="11" fill="#047857">normal → 无需审批</text>
  <text x="230" y="556" text-anchor="middle" font-size="11" fill="#047857">仅销售确认节点</text>

  <rect x="480" y="494" width="240" height="72" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">指导价 &gt; 单价 ≥ 线控价</text>
  <text x="600" y="538" text-anchor="middle" font-size="11" fill="#047857">line_approval → 线级审批</text>
  <text x="600" y="556" text-anchor="middle" font-size="11" fill="#047857">line_pricer 审批</text>

  <rect x="850" y="494" width="240" height="72" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="970" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">线控价 &gt; 单价 ≥ 公司控价</text>
  <text x="970" y="538" text-anchor="middle" font-size="11" fill="#047857">company_approval → 公司级</text>
  <text x="970" y="556" text-anchor="middle" font-size="11" fill="#047857">线级 → 公司级两节点</text>

  <rect x="110" y="576" width="240" height="0" fill="none"/>
  <text x="360" y="590" font-size="11" fill="#dc2626">单价 &lt; 公司控制价 = forbidden，禁止提交（低于底线）</text>
  <text x="360" y="608" font-size="11" fill="#64748b">提交后报价状态：draft → submitted，进入审批中心</text>
</svg>

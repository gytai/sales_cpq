<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="820" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">基础数据配置地图（按 ①→④ 顺序准备）</text>

  <!-- ===== 容器1：产品中心 ===== -->
  <rect x="30" y="70" width="440" height="380" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="50" y="98" font-size="15" font-weight="600" fill="#1e40af">① CPQ 产品中心</text>

  <rect x="60" y="112" width="175" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="147" y="136" text-anchor="middle" font-size="12.5" fill="#1e40af">产品系列</text>
  <line x1="147" y1="150" x2="147" y2="166" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <rect x="60" y="170" width="175" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="147" y="194" text-anchor="middle" font-size="12.5" fill="#1e40af">产品型号</text>
  <line x1="147" y1="208" x2="147" y2="224" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <rect x="60" y="228" width="175" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="147" y="252" text-anchor="middle" font-size="12.5" fill="#1e40af">配置组</text>
  <line x1="147" y1="266" x2="147" y2="282" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <rect x="60" y="286" width="175" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="147" y="310" text-anchor="middle" font-size="12.5" fill="#1e40af">配置选项</text>
  <line x1="147" y1="324" x2="147" y2="340" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <rect x="60" y="344" width="175" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="147" y="368" text-anchor="middle" font-size="12.5" fill="#1e40af">型号配置结构</text>

  <rect x="268" y="170" width="178" height="38" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
  <text x="357" y="188" text-anchor="middle" font-size="12" fill="#065f46">参数定义</text>
  <text x="357" y="202" text-anchor="middle" font-size="10" fill="#047857">+ 型号参数（技术参数）</text>
  <line x1="235" y1="189" x2="264" y2="189" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="268" y="228" width="178" height="38" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
  <text x="357" y="246" text-anchor="middle" font-size="12" fill="#065f46">配置规则</text>
  <text x="357" y="260" text-anchor="middle" font-size="10" fill="#047857">依赖 / 互斥 / 显隐</text>
  <line x1="243" y1="247" x2="264" y2="247" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>

  <rect x="268" y="286" width="178" height="38" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
  <text x="357" y="304" text-anchor="middle" font-size="12" fill="#065f46">BOM 映射 / 推荐模板</text>
  <text x="357" y="318" text-anchor="middle" font-size="10" fill="#047857">配件与服务</text>

  <text x="50" y="408" font-size="10.5" fill="#64748b">版本化生命周期：草稿 → 提交 → 发布 → 停用（发布后的型号才能进入报价）</text>
  <text x="50" y="428" font-size="10.5" fill="#64748b">绿色节点为挂在型号/选项上的扩展配置</text>

  <!-- ===== 容器2：价格中心 ===== -->
  <rect x="490" y="70" width="440" height="380" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="510" y="98" font-size="15" font-weight="600" fill="#b45309">② CPQ 价格中心</text>

  <rect x="520" y="112" width="175" height="38" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="607" y="136" text-anchor="middle" font-size="12.5" fill="#92400e">价格表</text>
  <line x1="695" y1="131" x2="722" y2="131" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <rect x="726" y="112" width="178" height="38" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="815" y="130" text-anchor="middle" font-size="12" fill="#92400e">价格条目</text>
  <text x="815" y="144" text-anchor="middle" font-size="10" fill="#b45309">型号/选项的基准价</text>

  <rect x="520" y="170" width="384" height="52" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="712" y="191" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">价格策略（三层控制价）</text>
  <text x="712" y="209" text-anchor="middle" font-size="10.5" fill="#b45309">指导价 ≥ 产线控制价 ≥ 公司控制价（决定审批分级）</text>

  <rect x="520" y="234" width="175" height="38" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="607" y="252" text-anchor="middle" font-size="12" fill="#92400e">价格规则</text>
  <text x="607" y="266" text-anchor="middle" font-size="10" fill="#b45309">条件调价</text>
  <rect x="726" y="234" width="178" height="38" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="815" y="252" text-anchor="middle" font-size="12" fill="#92400e">汇率 / 税率 / 费用规则</text>
  <text x="815" y="266" text-anchor="middle" font-size="10" fill="#b45309">跨币种与税费</text>

  <rect x="620" y="292" width="175" height="38" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="707" y="316" text-anchor="middle" font-size="12.5" fill="#92400e">发布版本</text>
  <line x1="607" y1="272" x2="607" y2="286" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="607" y1="286" x2="680" y2="286" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="680" y1="286" x2="700" y2="292" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <line x1="815" y1="272" x2="815" y2="286" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="815" y1="286" x2="735" y2="286" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="735" y1="286" x2="715" y2="292" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>

  <text x="510" y="358" font-size="10.5" fill="#64748b">价格发布后不可变，未生效可撤回；价格模拟器可独立试算</text>
  <text x="510" y="378" font-size="10.5" fill="#64748b">策略维度：公司 / 市场 / 区域 / 客户等级 / 代理等级 / 型号…</text>
  <text x="510" y="398" font-size="10.5" fill="#64748b">同维度同区间不可重叠（发布校验拦截）</text>

  <!-- 跨组依赖：产品型号 → 价格条目 -->
  <path d="M 430,140 C 460,140 460,131 516,131" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <rect x="440" y="106" width="62" height="16" fill="#ffffff" opacity="0.95"/>
  <text x="471" y="118" text-anchor="middle" font-size="10" fill="#ea580c">定价对象</text>

  <!-- ===== 容器3：客户与渠道 ===== -->
  <rect x="30" y="470" width="440" height="310" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="50" y="498" font-size="15" font-weight="600" fill="#7c2d12">③ CPQ 客户与渠道</text>

  <rect x="60" y="512" width="175" height="38" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.2"/>
  <text x="147" y="530" text-anchor="middle" font-size="12" fill="#9d174d">销售区域（树）</text>
  <text x="147" y="544" text-anchor="middle" font-size="10" fill="#be185d">默认币种/组织</text>
  <rect x="268" y="512" width="178" height="38" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.2"/>
  <text x="357" y="530" text-anchor="middle" font-size="12" fill="#9d174d">销售组织（树）</text>
  <text x="357" y="544" text-anchor="middle" font-size="10" fill="#be185d">成员 + 生效区间</text>

  <rect x="60" y="570" width="175" height="38" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.2"/>
  <text x="147" y="594" text-anchor="middle" font-size="12.5" fill="#9d174d">客户等级</text>
  <line x1="147" y1="608" x2="147" y2="624" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="268" y="570" width="178" height="38" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.2"/>
  <text x="357" y="594" text-anchor="middle" font-size="12.5" fill="#9d174d">代理等级</text>
  <line x1="357" y1="608" x2="357" y2="624" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="60" y="628" width="175" height="38" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.2"/>
  <text x="147" y="652" text-anchor="middle" font-size="12.5" fill="#9d174d">客户</text>
  <rect x="268" y="628" width="178" height="38" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.2"/>
  <text x="357" y="652" text-anchor="middle" font-size="12.5" fill="#9d174d">代理商</text>

  <text x="50" y="696" font-size="10.5" fill="#64748b">客户挂载：区域 / 客户等级 / 代理商 / 销售组织 / 负责人；</text>
  <text x="50" y="716" font-size="10.5" fill="#64748b">客户与代理商等级参与价格策略维度匹配</text>

  <!-- ===== 容器4：权限与审批 ===== -->
  <rect x="490" y="470" width="440" height="310" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="510" y="498" font-size="15" font-weight="600" fill="#312e81">④ 权限与审批配置</text>

  <rect x="520" y="512" width="384" height="52" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="712" y="533" text-anchor="middle" font-size="12.5" font-weight="600" fill="#312e81">后台角色组（权限 → 角色组 → 成员）</text>
  <text x="712" y="551" text-anchor="middle" font-size="10.5" fill="#4338ca">sales / line_pricer / company_pricer / finance_reviewer…</text>

  <rect x="520" y="580" width="384" height="52" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="712" y="601" text-anchor="middle" font-size="12.5" font-weight="600" fill="#312e81">数据范围授权（产品线）</text>
  <text x="712" y="619" text-anchor="middle" font-size="10.5" fill="#4338ca">列表/详情/审批按 产品线 ∩ 组织 ∩ 区域 ∩ 负责人 过滤</text>

  <rect x="520" y="648" width="384" height="52" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="712" y="669" text-anchor="middle" font-size="12.5" font-weight="600" fill="#312e81">审批规则（审批中心 → 审批规则）</text>
  <text x="712" y="687" text-anchor="middle" font-size="10.5" fill="#4338ca">节点 + 审批角色 + 适用产品线 + 候选人 + SLA 小时</text>

  <text x="510" y="726" font-size="10.5" fill="#64748b">销售确认节点固定由报价负责人处理，无需配置规则；</text>
  <text x="510" y="746" font-size="10.5" fill="#64748b">审批角色编码须与角色组名称精确一致（如 line_pricer）</text>

  <!-- 底部图例 -->
  <rect x="30" y="770" width="900" height="0" fill="none"/>
  <line x1="60" y1="790" x2="100" y2="790" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="110" y="794" font-size="11" fill="#475569">配置顺序</text>
  <line x1="210" y1="790" x2="250" y2="790" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <text x="260" y="794" font-size="11" fill="#475569">跨中心依赖</text>
  <text x="380" y="794" font-size="11" fill="#475569">虚线框 = 后台菜单分组；节点颜色区分所属中心</text>
</svg>

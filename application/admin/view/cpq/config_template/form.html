<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">模板编码:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[code]" value="{$row.code|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">模板名称:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[name]" value="{$row.name|htmlentities}"></div>
    </div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">产品型号:</label><div class="col-xs-12 col-sm-8"><input class="form-control selectpage" data-rule="required" data-source="cpq/product_model/index" data-field="name" name="row[model_id]" value="{$row.model_id|htmlentities}"></div></div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">适用市场:</label><div class="col-xs-12 col-sm-3"><input class="form-control" name="row[market_scope]" value="{$row.market_scope|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">客户等级:</label><div class="col-xs-12 col-sm-3"><input class="form-control" name="row[customer_level]" value="{$row.customer_level|htmlentities}"></div>
    </div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">配置 JSON:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" data-rule="required" rows="8" name="row[config_json]">{$row.config_json|htmlentities}</textarea><p class="help-block">发布时会调用同一配置规则引擎校验。</p></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">推荐说明:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" rows="3" name="row[description]">{$row.description|htmlentities}</textarea></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">版本:</label><div class="col-xs-12 col-sm-3"><input class="form-control" type="number" min="1" name="row[version]" value="{$row.version|htmlentities}"></div><input type="hidden" name="row[status]" value="{$row.status|htmlentities}"></div>
    <div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">保存</button></div></div>
</form>

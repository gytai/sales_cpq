<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <div class="btn-group" id="cpq-approval-tabs" style="margin-left:8px">
                    <button type="button" class="btn btn-default active" data-category="pending">待处理</button>
                    <button type="button" class="btn btn-default" data-category="processed">已处理</button>
                    <button type="button" class="btn btn-default" data-category="cc">抄送我的</button>
                </div>
                <select id="cpq-approval-node" class="form-control" style="display:inline-block;width:150px;margin-left:8px">
                    <option value="">全部节点</option>
                    {foreach name="nodeList" key="nodeKey" item="nodeText"}
                    <option value="{$nodeKey}">{$nodeText}</option>
                    {/foreach}
                </select>
                <select id="cpq-approval-line" class="form-control" style="display:inline-block;width:150px;margin-left:4px">
                    <option value="">全部产品线</option>
                    {foreach name="productLineList" item="line"}
                    <option value="{$line}">{$line}</option>
                    {/foreach}
                </select>
                <input type="text" id="cpq-approval-keyword" class="form-control" style="display:inline-block;width:180px;margin-left:4px" placeholder="单号/名称关键字">
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                   data-auth-detail="{:$auth->check('cpq/approval_task/detail')}"
                   data-auth-urge="{:$auth->check('cpq/approval_task/urge')}"
                   data-auth-action="{:$auth->check('cpq/approval_task/action')}"
                   width="100%">
            </table>
        </div>
    </div>
</div>

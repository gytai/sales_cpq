<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh,add,edit,del')}
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                   data-operate-edit="{:$auth->check('cpq/product_model/edit')}"
                   data-operate-del="{:$auth->check('cpq/product_model/del')}"
                   data-operate-detail="{:$auth->check('cpq/product_model/detail')}"
                   data-auth-submit="{:$auth->check('cpq/product_model/submit')}"
                   data-auth-publish="{:$auth->check('cpq/product_model/publish')}"
                   data-auth-expire="{:$auth->check('cpq/product_model/expire')}"
                   data-auth-copy="{:$auth->check('cpq/product_model/copy')}"
                   width="100%">
            </table>
        </div>
    </div>
</div>

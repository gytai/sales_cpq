<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <select id="cpq-instance-status" class="form-control" style="display:inline-block;width:140px;margin-left:8px">
                    <option value="">全部状态</option>
                    {foreach name="statusList" key="statusKey" item="statusText"}
                    <option value="{$statusKey}">{$statusText}</option>
                    {/foreach}
                </select>
                <input type="text" id="cpq-instance-keyword" class="form-control" style="display:inline-block;width:180px;margin-left:4px" placeholder="单号/名称关键字">
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                   data-auth-flow="{:$auth->check('cpq/approval_instance/flow')}"
                   data-auth-withdraw="{:$auth->check('cpq/approval_instance/withdraw')}"
                   data-auth-urge="{:$auth->check('cpq/approval_task/urge')}"
                   width="100%">
            </table>
        </div>
    </div>
</div>

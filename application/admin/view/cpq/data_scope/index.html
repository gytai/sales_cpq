<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <input type="text" id="cpq-scope-keyword" class="form-control" style="display:inline-block;width:200px;margin-left:8px" placeholder="用户名/昵称关键字">
            </div>
            <p class="text-muted" style="padding:8px 15px 0;margin:0">列出存在 CPQ 角色或已有产品线/组织授权记录的管理员；点击「授权管理」查看有效数据范围预览并维护授权。</p>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
        </div>
    </div>
</div>

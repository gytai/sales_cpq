<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">编码:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[code]" value="{$row.code|htmlentities}"></div><label class="control-label col-xs-12 col-sm-2">名称:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" name="row[name]" value="{$row.name|htmlentities}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">公司:</label><div class="col-xs-12 col-sm-3"><input class="form-control" name="row[company]" value="{$row.company|htmlentities}"></div><label class="control-label col-xs-12 col-sm-2">业务板块:</label><div class="col-xs-12 col-sm-3"><input class="form-control" name="row[business_unit]" value="{$row.business_unit|htmlentities}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">市场范围:</label><div class="col-xs-12 col-sm-3">{:build_select('row[market_scope]', $marketScopeList, $row.market_scope, ['class'=>'form-control selectpicker'])}</div><label class="control-label col-xs-12 col-sm-2">含税方式:</label><div class="col-xs-12 col-sm-3">{:build_select('row[tax_mode]', $taxModeList, $row.tax_mode, ['class'=>'form-control selectpicker'])}</div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">币种:</label><div class="col-xs-12 col-sm-3"><input class="form-control" data-rule="required" maxlength="3" name="row[currency]" value="{$row.currency|htmlentities}"></div><label class="control-label col-xs-12 col-sm-2">优先级:</label><div class="col-xs-12 col-sm-3"><input class="form-control" type="number" name="row[priority]" value="{$row.priority|htmlentities}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">生效日期:</label><div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-rule="required" data-date-format="YYYY-MM-DD" name="row[effective_date]" value="{$row.effective_date|htmlentities}"></div><label class="control-label col-xs-12 col-sm-2">失效日期:</label><div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[expiry_date]" value="{$row.expiry_date|htmlentities}"></div></div>
<input type="hidden" name="row[version]" value="{$row.version|htmlentities}"><input type="hidden" name="row[status]" value="{$row.status|htmlentities}">
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">保存</button></div></div></form>

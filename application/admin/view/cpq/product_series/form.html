<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[status]" value="{$row.status|htmlentities}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">系列编码:</label>
        <div class="col-xs-12 col-sm-8"><input class="form-control" data-rule="required" name="row[code]" value="{$row.code|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">中文名称:</label>
        <div class="col-xs-12 col-sm-8"><input class="form-control" data-rule="required" name="row[name]" value="{$row.name|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">英文名称:</label>
        <div class="col-xs-12 col-sm-8"><input class="form-control" name="row[name_en]" value="{$row.name_en|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">业务板块:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" name="row[business_unit]" value="{$row.business_unit|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">产品线:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" name="row[product_line]" value="{$row.product_line|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">品牌:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" name="row[brand]" value="{$row.brand|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">版本:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" type="number" min="1" name="row[version]" value="{$row.version|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">默认单位:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" name="row[default_unit]" value="{$row.default_unit|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">默认币种:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control" maxlength="3" name="row[default_currency]" value="{$row.default_currency|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">生效日期:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[effective_date]" value="{$row.effective_date|htmlentities}"></div>
        <label class="control-label col-xs-12 col-sm-2">失效日期:</label>
        <div class="col-xs-12 col-sm-3"><input class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[expiry_date]" value="{$row.expiry_date|htmlentities}"></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">产品图片:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image" class="form-control" name="row[image]" value="{$row.image|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <button type="button" id="faupload-image" class="btn btn-danger faupload" data-input-id="c-image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-upload"></i> 上传</button>
                </div>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">产品说明:</label>
        <div class="col-xs-12 col-sm-8"><textarea class="form-control" rows="4" name="row[description]">{$row.description|htmlentities}</textarea></div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">保存</button></div>
    </div>
</form>

<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh')}
                <div class="btn-group" id="cpq-todo-tabs" style="margin-left:8px">
                    <button type="button" class="btn btn-default active" data-category="pending">待处理</button>
                    <button type="button" class="btn btn-default" data-category="processed">已处理</button>
                    <button type="button" class="btn btn-default" data-category="initiated">我发起的</button>
                    <button type="button" class="btn btn-default" data-category="cc">抄送我的</button>
                </div>
                <select id="cpq-todo-node" class="form-control" style="display:inline-block;width:150px;margin-left:8px">
                    <option value="">全部节点</option>
                    {foreach name="nodeList" key="nodeKey" item="nodeText"}
                    <option value="{$nodeKey}">{$nodeText}</option>
                    {/foreach}
                </select>
                <select id="cpq-todo-line" class="form-control" style="display:inline-block;width:150px;margin-left:4px">
                    <option value="">全部产品线</option>
                    {foreach name="productLineList" item="line"}
                    <option value="{$line}">{$line}</option>
                    {/foreach}
                </select>
                <input type="text" id="cpq-todo-keyword" class="form-control" style="display:inline-block;width:180px;margin-left:4px" placeholder="单号/名称关键字">
                <a href="javascript:;" class="btn btn-warning btn-cpq-batch-transfer" style="margin-left:8px" title="将勾选的待处理任务转交给同一处理人"><i class="fa fa-share"></i> 批量转交</a>
                <a href="javascript:;" class="btn btn-default disabled" title="批量批准默认禁用：审批须逐条进入详情，核实配置、价格与风险后处理"><i class="fa fa-ban"></i> 批量批准</a>
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                   data-auth-detail="{:$auth->check('cpq/approval_task/detail')}"
                   data-auth-batchtransfer="{:$auth->check('cpq/todo/batchtransfer')}"
                   data-auth-urge="{:$auth->check('cpq/todo/urge')}"
                   data-auth-flow="{:$auth->check('cpq/approval_instance/flow')}"
                   data-auth-withdraw="{:$auth->check('cpq/approval_instance/withdraw')}"
                   width="100%">
            </table>
        </div>
    </div>
</div>
